name: Curated Wall Scene Review
on:
  push:
    branches: [main]
    paths:
      - 'tools/preview_wall_candidates.py'
      - '.github/workflows/wall-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wall-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pillow
        run: python -m pip install pillow==11.3.0
      - name: Fetch and review potential blank-wall photos
        run: python tools/preview_wall_candidates.py
      - name: Upload contact sheet and originals
        uses: actions/upload-artifact@v4
        with:
          name: VSP-Curated-Wall-Photo-Review
          path: build/wall_candidate_review/
          if-no-files-found: error
