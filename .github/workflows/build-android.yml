name: VSP Wall Studio 3.2 - 24 Ready Room Scenes APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack and publish Android source (first build only)
        shell: bash
        run: |
          if [ -f bootstrap/android-source-v2.tar.xz.base64 ]; then
            base64 --decode bootstrap/android-source-v2.tar.xz.base64 | tar -xJf -
            test -f app/src/main/AndroidManifest.xml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- app build.gradle.kts settings.gradle.kts gradle.properties gradle
            git rm -f bootstrap/android-source-v2.tar.xz.base64
            if ! git diff --cached --quiet; then
              git commit -m "Unpack editable Android Studio project sources"
              git push || echo "Source publishing was blocked; APK build will continue."
            fi
          fi
          test -f app/build.gradle.kts
      - name: Apply and publish v2.1 manual crop and camera fixes
        shell: bash
        run: |
          if [ -f bootstrap/v21-crop-camera-patch.tar.xz.base64 ]; then
            base64 --decode bootstrap/v21-crop-camera-patch.tar.xz.base64 | tar -xJf -
            test -f app/src/main/java/com/vintagesoulprint/wallmuse/CropEditorView.kt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- app
            git rm -f bootstrap/v21-crop-camera-patch.tar.xz.base64
            if ! git diff --cached --quiet; then
              git commit -m "Implement manual touch crop and sensor-aware camera rotation (v2.1)"
              git push || echo "Source publishing blocked; continue APK compilation."
            fi
          fi
      - name: Install V2.3 photo frame assets and fullscreen fix
        shell: bash
        run: |
          if [ -f bootstrap/v23-image-frames.tar.xz.base64 ]; then
            base64 --decode bootstrap/v23-image-frames.tar.xz.base64 | tar -xJf -
            python3 tools/apply_v23_patch.py
            test "$(find app/src/main/assets/frames -name '*.webp' | wc -l)" -eq 12
            test -f app/src/main/java/com/vintagesoulprint/wallmuse/FramePhotoLibrary.kt
            python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          assert 'versionCode = 6' in s and 'versionName = "2.2.1"' in s
          p.write_text(s.replace('versionCode = 6','versionCode = 7').replace('versionName = "2.2.1"','versionName = "2.3.0"'))
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- app tools docs
            git rm -f bootstrap/v23-image-frames.tar.xz.base64
            if ! git diff --cached --quiet; then
              git commit -m "V2.3: 12 photo frames, immersive fullscreen, stable test APK"
              git push || echo "Publishing V2.3 source blocked; APK build continues."
            fi
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 with hosted SDK tools
        shell: bash
        run: |
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore public preview-only signing key
        shell: bash
        run: |
          base64 --decode app/preview-test-only.jks.base64 > app/preview-test-only.jks
          keytool -list -keystore app/preview-test-only.jks -storepass androidtest -alias VspWallStudioPreview > /dev/null
      - name: Bundle 24 credited Pexels room backgrounds for OFFLINE use
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 tools/prepare_room_assets.py
          test "$(find app/src/main/assets/rooms -maxdepth 1 -name 'room_??.jpg' | wc -l)" -eq 24
          test "$(find app/src/main/assets/rooms -maxdepth 1 -name 'thumb_room_??.jpg' | wc -l)" -eq 24
      - name: Run tests and build test APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - name: Validate preview APK identity and certificate
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.vintagesoulprint.wallmuse.preview'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: VSP-Wall-Studio-v3.2-24-Ready-Rooms-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB for engineering checks (NOT FOR PLAY UPLOAD)
        uses: actions/upload-artifact@v4
        with:
          name: VSP-Wall-Studio-v3.2-UNSIGNED-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VSP-Wall-Studio-v3.2-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
