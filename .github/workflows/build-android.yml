name: VSP Wall Studio 2.0 - Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack and publish Android source (first build only)
        shell: bash
        run: |
          if [ -f bootstrap/android-source-v2.tar.xz.base64 ]; then
            base64 --decode bootstrap/android-source-v2.tar.xz.base64 | tar -xJf -
            test -f app/src/main/AndroidManifest.xml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- app build.gradle.kts settings.gradle.kts gradle.properties gradle
            git rm -f bootstrap/android-source-v2.tar.xz.base64
            if ! git diff --cached --quiet; then
              git commit -m "Unpack editable Android Studio project sources"
              git push || echo "Source publishing was blocked; APK build will continue."
            fi
          fi
          test -f app/build.gradle.kts
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 with hosted SDK tools
        shell: bash
        run: |
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run tests and build test APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: VSP-Wall-Studio-v2-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VSP-Wall-Studio-v2-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
